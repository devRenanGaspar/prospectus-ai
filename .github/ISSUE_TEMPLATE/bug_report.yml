name: Bug report
description: Report a reproducible product defect without sensitive data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, customer data, or security vulnerabilities. Use the Security tab for private vulnerability reports.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What is blocked or incorrect, and who is affected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using non-sensitive sample data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA or deployment time
